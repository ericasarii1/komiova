<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KomiOva — Baca Komik</title>
<style>
:root{--bg:#0e0e1a;--card:#1a1a2e;--card2:#16162a;--accent:#ff6b35;--accent2:#ffd369;--text:#eaeaf2;--muted:#8a8aa3;--radius:14px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:10;background:rgba(14,14,26,.92);backdrop-filter:blur(10px);border-bottom:1px solid #22223a;padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-size:1.35rem;font-weight:800;letter-spacing:.5px;color:var(--accent)}
.logo span{color:var(--accent2)}
#search{flex:1;min-width:180px;max-width:420px;background:var(--card2);border:1px solid #2a2a44;color:var(--text);padding:10px 16px;border-radius:999px;font-size:.95rem;outline:none}
#search:focus{border-color:var(--accent)}
#tabs{display:flex;gap:8px;margin-left:auto}
.tab{background:transparent;border:1px solid #2a2a44;color:var(--muted);padding:8px 16px;border-radius:999px;cursor:pointer;font-size:.9rem}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
main{max-width:1100px;margin:0 auto;padding:24px 18px 80px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.comic{cursor:pointer;transition:transform .15s}
.comic:hover{transform:translateY(-4px)}
.cover-wrap{position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:3/4;background:var(--card)}
.cover-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:8px;left:8px;background:var(--accent);color:#fff;font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:6px}
.fav{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);border:none;color:#fff;font-size:1.05rem;width:32px;height:32px;border-radius:50%;cursor:pointer;transition:transform .15s}
.fav:hover{transform:scale(1.15)}
.fav.on{color:var(--accent2)}
.comic h3{font-size:.92rem;margin-top:8px;line-height:1.3}
.comic p{font-size:.75rem;color:var(--muted);margin-top:2px}
h2.section{margin:8px 0 16px;font-size:1.15rem}
.empty{color:var(--muted);text-align:center;padding:60px 0}
/* detail */
#detail{display:none;max-width:800px;margin:0 auto}
#detail .back{background:none;border:1px solid #2a2a44;color:var(--muted);padding:8px 18px;border-radius:999px;cursor:pointer;margin-bottom:16px;font-size:.9rem}
#detail .back:hover{color:var(--text);border-color:var(--accent)}
.detail-head{display:flex;gap:20px;flex-wrap:wrap}
.detail-head img{width:210px;border-radius:var(--radius);aspect-ratio:3/4;object-fit:cover}
.detail-info{flex:1;min-width:220px}
.detail-info h1{font-size:1.5rem;margin-bottom:6px}
.meta{color:var(--muted);font-size:.85rem;margin-bottom:4px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tag{background:var(--card2);border:1px solid #2a2a44;font-size:.72rem;padding:4px 10px;border-radius:999px;color:var(--accent2)}
.desc{color:#c5c5d6;font-size:.9rem;line-height:1.6;margin:10px 0 16px}
.ch-list{margin-top:22px}
.ch-item{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid #23233c;padding:13px 16px;border-radius:10px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.ch-item:hover{border-color:var(--accent)}
/* reader */
#reader{display:none;position:fixed;inset:0;background:#0a0a12;z-index:50;overflow-y:auto;padding-bottom:40px}
#reader-bar{position:sticky;top:0;background:rgba(10,10,18,.95);backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;padding:10px 14px;z-index:5;border-bottom:1px solid #1e1e34}
#reader-bar .title{flex:1;font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nbtn{background:var(--accent);border:none;color:#fff;padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.85rem}
.nbtn:disabled{background:#33334d;cursor:not-allowed}
.xbtn{background:none;border:1px solid #2a2a44;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1.1rem}
#pages img{display:block;max-width:720px;width:100%;margin:0 auto}
footer{text-align:center;color:var(--muted);font-size:.78rem;padding:30px 0}
@media(max-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}.detail-head img{width:150px}}
</style>
</head>
<body>
<header>
  <div class="logo">Komi<span>Ova</span></div>
  <input id="search" placeholder="🔍 Cari judul atau genre...">
  <div id="tabs">
    <button class="tab active" data-f="all">Semua</button>
    <button class="tab" data-f="fav">❤ Favorit</button>
  </div>
</header>
<main>
  <div id="home">
    <h2 class="section" id="sec-title">Daftar Komik</h2>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">Nggak ada komik yang cocok 😅</div>
  </div>
  <div id="detail"></div>
</main>
<div id="reader">
  <div id="reader-bar">
    <button class="xbtn" id="close-reader">✕</button>
    <div class="title" id="r-title"></div>
    <button class="nbtn" id="prev-ch">‹ Prev</button>
    <button class="nbtn" id="next-ch">Next ›</button>
  </div>
  <div id="pages"></div>
</div>
<footer>KomiOva · baca komik enak, gratis ✌️</footer>
<script>
let COMICS=[],FAVS=JSON.parse(localStorage.getItem("komiova_favs")||"[]"),filter="all",q="";
const $=s=>document.querySelector(s);
async function load(){
  COMICS=await (await fetch("/api/comics")).json();
  render();
}
function render(){
  let list=COMICS;
  if(filter==="fav")list=list.filter(c=>FAVS.includes(c.id));
  if(q)list=list.filter(c=>c.title.toLowerCase().includes(q)||c.genre.some(g=>g.toLowerCase().includes(q)));
  $("#sec-title").textContent=filter==="fav"?"Komik Favorit":"Daftar Komik";
  $("#grid").innerHTML=list.map(c=>`
    <div class="comic" onclick="openDetail('${c.id}')">
      <div class="cover-wrap">
        <img src="${c.cover}" alt="${c.title}" loading="lazy">
        <span class="badge">${c.status}</span>
        <button class="fav ${FAVS.includes(c.id)?"on":""}" onclick="toggleFav(event,'${c.id}')">${FAVS.includes(c.id)?"★":"☆"}</button>
      </div>
      <h3>${c.title}</h3><p>${c.author}</p>
    </div>`).join("");
  $("#empty").style.display=list.length?"none":"block";
}
function toggleFav(e,id){e.stopPropagation();FAVS=FAVS.includes(id)?FAVS.filter(x=>x!==id):[...FAVS,id];localStorage.setItem("komiova_favs",JSON.stringify(FAVS));render();}
async function openDetail(id){
  const c=await (await fetch("/api/comics/"+id)).json();
  $("#home").style.display="none";
  const d=$("#detail");d.style.display="block";
  d.innerHTML=`<button class="back" onclick="goHome()">← Kembali</button>
    <div class="detail-head">
      <img src="${c.cover}">
      <div class="detail-info">
        <h1>${c.title}</h1>
        <div class="meta">✍ ${c.author} · 📡 ${c.status}</div>
        <div class="tags">${c.genre.map(g=>`<span class="tag">${g}</span>`).join("")}</div>
        <p class="desc">${c.desc}</p>
      </div>
    </div>
    <div class="ch-list"><h2 class="section">Daftar Chapter</h2>
    ${c.chapters.map(ch=>`<div class="ch-item" onclick="openReader('${c.id}',${ch.num})"><span>Ch. ${ch.num}</span><span class="meta">${ch.title}</span></div>`).join("")}
    </div>`;
  window.scrollTo(0,0);
}
function goHome(){$("#detail").style.display="none";$("#detail").innerHTML="";$("#home").style.display="block";}
let CUR=null,CURC=null;
async function openReader(cid,num){
  const c=await (await fetch("/api/comics/"+cid)).json();
  CUR=c;const ch=c.chapters.find(x=>x.num===num)||c.chapters[0];CURC=ch.num;
  $("#r-title").textContent=`${c.title} — Ch. ${ch.num}: ${ch.title}`;
  $("#pages").innerHTML=ch.pages.map(p=>`<img src="${p}" loading="lazy">`).join("");
  $("#reader").style.display="block";document.body.style.overflow="hidden";
  $("#reader").scrollTop=0;
  $("#prev-ch").disabled=CURC===c.chapters[0].num;
  $("#next-ch").disabled=CURC===c.chapters[c.chapters.length-1].num;
}
$("#prev-ch").onclick=()=>openReader(CUR.id,CURC-1);
$("#next-ch").onclick=()=>openReader(CUR.id,CURC+1);
$("#close-reader").onclick=()=>{$("#reader").style.display="none";document.body.style.overflow="";};
$("#search").oninput=e=>{q=e.target.value.toLowerCase().trim();render();};
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");filter=t.dataset.f;render();});
load();
</script>
</body>
</html>
